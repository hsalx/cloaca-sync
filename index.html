<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<title>CLOACA Sync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E13; --card: #121922; --border: #1F2935; --text: #E8EEF4;
    --muted: #8391A1; --dim: #4A5563;
    --green: #34D399; --lime: #A3E635; --amber: #FBBF24; --orange: #FB923C; --red: #F87171;
    --t: #FF8A65; --td: #22D3EE; --rh: #60A5FA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 4px 16px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: .5px; }
  h1 span { color: var(--muted); font-weight: 500; }
  .pill { font-size: 12px; letter-spacing: 1.5px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 14px 16px; margin-bottom: 12px; }
  .cap { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .loc { font-size: 15px; }
  .sub { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  svg { width: 100%; height: 130px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend b { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  button { width: 100%; border: 0; border-radius: 18px; padding: 20px; margin: 4px 0 12px;
    font: 700 18px Montserrat, system-ui, sans-serif; letter-spacing: 2px;
    background: var(--green); color: #06251A; cursor: pointer; }
  button:disabled { background: var(--border); color: var(--dim); }
  #log { font-size: 13px; color: var(--muted); line-height: 1.7; min-height: 22px; }
  #log .ok { color: var(--green); } #log .err { color: var(--red); }
  .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .hidden { display: none; }
  .search { display: flex; gap: 8px; margin-top: 12px; }
  .search input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; font: 500 15px Montserrat, system-ui, sans-serif; }
  .search input:focus { outline: none; border-color: var(--muted); }
  button.ghost { width: auto; margin: 0; padding: 12px 14px; border-radius: 12px; font-size: 13px; letter-spacing: 1px;
    background: transparent; color: var(--text); border: 1px solid var(--border); }
  .results { margin-top: 8px; }
  .result { padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 15px; }
  .result:last-child { border-bottom: 0; }
  .result span { color: var(--muted); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 10px; cursor: pointer; }
  .warn { color: var(--amber); }
</style>
</head>
<body>
<main>
  <header>
    <h1>CLOACA <span>/ SYNC</span></h1>
    <div class="pill"><i id="dot"></i><span id="state">STARTING</span></div>
  </header>

  <section class="card">
    <div class="cap">Location</div>
    <div class="row"><div class="loc" id="loc">Locating&hellip;</div><div class="sub" id="elev"></div></div>
    <div class="sub" id="fetched"></div>
    <div class="sub" id="nwr"></div>
    <form class="search" id="search" autocomplete="off">
      <input id="q" type="search" placeholder="Town, or paste coordinates / map link" enterkeyhint="search"
             aria-label="Search for a place">
      <button type="button" class="ghost" id="gps" title="Use this phone's location">GPS</button>
    </form>
    <div class="results" id="results"></div>
    <div class="chips" id="recent"></div>
  </section>

  <section class="card">
    <div class="cap">Next 24 h</div>
    <div class="grid">
      <div class="stat"><div class="v" id="s-low">--</div><div class="l">Low</div></div>
      <div class="stat"><div class="v" id="s-spread">--</div><div class="l">Min dew gap</div></div>
      <div class="stat"><div class="v" id="s-rain">--</div><div class="l">Rain chance</div></div>
      <div class="stat"><div class="v" id="s-wind">--</div><div class="l">Max gust</div></div>
      <div class="stat"><div class="v" id="s-cloud">--</div><div class="l">Cloud, night</div></div>
      <div class="stat"><div class="v" id="s-dp">--</div><div class="l">hPa, 12 h</div></div>
    </div>
  </section>

  <section class="card">
    <div class="cap">Temperature &amp; dew point, 72 h</div>
    <svg id="chart" viewBox="0 0 400 130" preserveAspectRatio="none" aria-label="Temperature and dew point forecast"></svg>
    <div class="legend"><span><b style="background:var(--t)"></b>Temp</span><span><b style="background:var(--td)"></b>Dew point</span><span><b style="background:var(--rh);opacity:.5"></b>Rain %</span><span id="range" style="margin-left:auto"></span></div>
  </section>

  <button id="sync" disabled>SYNC TO CLOACA</button>
  <div id="log"></div>

  <section class="card hidden" id="cabin">
    <div class="cap">Cabin, from CLOACA</div>
    <div class="row">
      <div><div class="big" id="c-co2">--</div><div class="sub">ppm CO2</div></div>
      <div style="text-align:right"><div class="loc" id="c-air">--</div><div class="sub" id="c-clim">--</div></div>
    </div>
  </section>
  <div class="sub" id="ver" style="text-align:center;margin-top:18px;color:var(--dim)"></div>
</main>

<script>
// CLOACA BLE service (see firmware main/ble_link.h)
const SVC    = 'c10aca00-5e9c-4a1a-9d0e-7c10aca0f00d';
const FC_CHR = 'c10aca01-5e9c-4a1a-9d0e-7c10aca0f00d';
const ST_CHR = 'c10aca02-5e9c-4a1a-9d0e-7c10aca0f00d';
const ENV_CHR= 'c10aca03-5e9c-4a1a-9d0e-7c10aca0f00d';
const HOURS = 72, CHUNK = 240;
// Bump together with version.txt on every publish. Phones cache this page
// (GitHub Pages: ~10 min, longer from a home-screen shortcut); load() compares
// against version.txt fetched uncached and reloads onto a fresh URL if stale.
const PAGE_VERSION = '2026-09-26.2';

const $ = id => document.getElementById(id);
let fc = null;   // { payload, meta, hourly }

function state(text, color) {
  $('state').textContent = text;
  $('dot').style.background = color || 'var(--dim)';
}
function log(msg, cls) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (cls) d.className = cls;
  $('log').appendChild(d);
}

function locate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('No geolocation'));
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords),
      e => reject(new Error('Location: ' + e.message)),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 10 * 60 * 1000 });
  });
}

const HOURLY = ['temperature_2m', 'apparent_temperature', 'relative_humidity_2m', 'dew_point_2m',
  'pressure_msl', 'surface_pressure', 'cloud_cover', 'cloud_cover_low', 'cloud_cover_mid',
  'cloud_cover_high', 'visibility', 'wind_speed_10m', 'wind_gusts_10m', 'wind_direction_10m',
  'precipitation', 'precipitation_probability', 'snowfall', 'uv_index', 'cape', 'weather_code', 'is_day'];
const DAILY = ['weather_code', 'temperature_2m_max', 'temperature_2m_min', 'precipitation_sum',
  'precipitation_probability_max', 'wind_gusts_10m_max', 'wind_direction_10m_dominant', 'uv_index_max',
  'sunrise', 'sunset'];

async function getJSON(url, what) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(what + ' HTTP ' + r.status);
  return r.json();
}

// Forecast + air quality (smoke). Air quality is optional: on failure those fields are sent as nan.
async function fetchForecast(lat, lon) {
  const ll = 'latitude=' + lat.toFixed(4) + '&longitude=' + lon.toFixed(4) + '&timeformat=unixtime&timezone=auto';
  const [j, aq, place] = await Promise.all([
    getJSON('https://api.open-meteo.com/v1/forecast?' + ll + '&hourly=' + HOURLY.join(',') +
            '&daily=' + DAILY.join(',') + '&wind_speed_unit=ms&forecast_days=8', 'Open-Meteo'),
    getJSON('https://air-quality-api.open-meteo.com/v1/air-quality?' + ll +
            '&hourly=pm2_5,pm10,us_aqi&forecast_days=4', 'Air quality').catch(e => { log(e.message + ' (skipping smoke data)', 'err'); return null; }),
    placeInfo(lat, lon).catch(() => ({ name: '', st: '', county: '' })),
  ]);
  j.place = place.name;
  j.county = place.county;
  try { j.nwr = pickNwr(await nwrList(), lat, lon, place.st, place.county); }
  catch (e) { j.nwr = null; log(e.message + ' (skipping weather radio)', 'err'); }
  j.aq = {};
  if (aq && aq.hourly)
    aq.hourly.time.forEach((t, i) => { j.aq[t] = [aq.hourly.pm2_5[i], aq.hourly.pm10[i], aq.hourly.us_aqi[i]]; });
  return j;
}

// Reverse geocode (BigDataCloud's free client-side API): display name like
// "Leavenworth, WA" (ASCII: CLOACA's fonts have no accents) plus the county,
// which picks the NOAA Weather Radio transmitter.
async function placeInfo(lat, lon) {
  const g = await getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
    lat.toFixed(4) + '&longitude=' + lon.toFixed(4) + '&localityLanguage=en', 'Place name');
  const town = g.city || g.locality || '';
  const st = (g.principalSubdivisionCode || '').split('-')[1] || '';
  const region = st || g.countryCode || '';
  const ascii = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '');
  const name = ascii([town, region].filter(Boolean).join(', ')).slice(0, 38);
  const admin = (g.localityInfo && g.localityInfo.administrative) || [];
  const cty = admin.map(x => x.name || '').find(n => /( County| Parish| Borough| Census Area| Municipality)$/.test(n));
  const county = cty ? cty.replace(/ (County|Parish|Borough|Census Area|Municipality)$/, '') : '';
  return { name, st: g.countryCode === 'US' ? st : '', county };
}

// ---- NOAA Weather Radio (web/nwr.json, built by tools/gen_nwr.py from NOAA's coverage list)
let NWR = null;
async function nwrList() {
  if (!NWR) NWR = (await getJSON('nwr.json', 'NWR list')).tx;
  return NWR;
}
function miles(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2 +
    Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
  return 7917.5 * Math.asin(Math.sqrt(a));
}
// Transmitters NOAA lists for the county, nearest first; otherwise the best
// power-weighted nearest (1 kW reaches ~40 mi, falling off roughly as P^0.25)
function pickNwr(tx, lat, lon, st, county) {
  const key = st && county ? `${st}:${county}` : '';
  let pool = key ? tx.filter(t => t[7].split('|').includes(key)) : [];
  const byCounty = pool.length > 0;
  if (!byCounty) pool = tx;
  let best = null, bestScore = Infinity;
  for (const t of pool) {
    const d = miles(lat, lon, t[0], t[1]);
    const score = byCounty ? d : d / (40 * Math.pow(Math.max(t[4], 10) / 1000, 0.25));
    if (score < bestScore) { bestScore = score; best = { freq: t[2], call: t[3], site: t[5], st: t[6], mi: d }; }
  }
  if (best && !byCounty && best.mi > 120) return null;   // no station within reach
  if (best) best.byCounty = byCounty;
  return best;
}

const f = c => (c === null || c === undefined) ? null : c * 1.8 + 32;   // display in °F

function num(v, digits) {
  return (v === null || v === undefined || Number.isNaN(v)) ? 'nan' : Number(v).toFixed(digits);  // never empty
}

// Build the wire payload (format v2, documented in firmware main/forecast.h)
function buildPayload(j) {
  const h = j.hourly, d = j.daily, now = Math.floor(Date.now() / 1000);
  const start = Math.max(0, h.time.findIndex(t => t + 3600 > now));
  const idx = [];
  for (let i = start; i < h.time.length && idx.length < HOURS; i++) idx.push(i);
  const lines = [`FC,2,${now},${j.utc_offset_seconds},${j.latitude.toFixed(4)},${j.longitude.toFixed(4)},${num(j.elevation, 0)}`];
  for (const i of idx) {
    const a = (j.aq || {})[h.time[i]] || [];
    lines.push(['H', h.time[i], num(h.temperature_2m[i], 1), num(h.apparent_temperature[i], 1),
      num(h.relative_humidity_2m[i], 0), num(h.dew_point_2m[i], 1), num(h.pressure_msl[i], 1),
      num(h.surface_pressure[i], 1), num(h.cloud_cover[i], 0), num(h.cloud_cover_low[i], 0),
      num(h.cloud_cover_mid[i], 0), num(h.cloud_cover_high[i], 0), num(h.visibility[i], 0),
      num(h.wind_speed_10m[i], 1), num(h.wind_gusts_10m[i], 1), num(h.wind_direction_10m[i], 0),
      num(h.precipitation[i], 1), num(h.precipitation_probability[i], 0), num(h.snowfall[i], 1),
      num(h.uv_index[i], 1), num(h.cape[i], 0), num(h.weather_code[i], 0), num(h.is_day[i], 0),
      num(a[0], 1), num(a[1], 1), num(a[2], 0)].join(','));
  }
  // daily rows from the local "today" onward
  const today = Math.floor((now + j.utc_offset_seconds) / 86400);
  let nd = 0;
  for (let i = 0; d && i < d.time.length && nd < 8; i++) {
    if (Math.floor((d.time[i] + j.utc_offset_seconds) / 86400) < today) continue;
    lines.push(['D', d.time[i], num(d.weather_code[i], 0), num(d.temperature_2m_max[i], 1),
      num(d.temperature_2m_min[i], 1), num(d.precipitation_sum[i], 1), num(d.precipitation_probability_max[i], 0),
      num(d.wind_gusts_10m_max[i], 1), num(d.wind_direction_10m_dominant[i], 0), num(d.uv_index_max[i], 1),
      d.sunrise[i] || 0, d.sunset[i] || 0].join(','));
    nd++;
  }
  if (j.place) lines.push(`N,${j.place}`);
  if (j.nwr) lines.push(`R,${j.nwr.freq},${j.nwr.call}`);
  lines.push(`END,${idx.length},${nd}`);
  return { text: lines.join('\n') + '\n', idx };
}

function summarize(j, idx) {
  const h = j.hourly, n24 = idx.slice(0, 24);
  const pick = k => n24.map(i => h[k][i]).filter(v => v !== null);
  const t = pick('temperature_2m'), rain = pick('precipitation_probability'), gust = pick('wind_gusts_10m');
  const spread = n24.map(i => h.temperature_2m[i] - h.dew_point_2m[i]);
  // "night" = local 21:00-06:00
  const night = n24.filter(i => { const hr = new Date((h.time[i] + j.utc_offset_seconds) * 1000).getUTCHours();
                                  return hr >= 21 || hr < 6; }).map(i => h.cloud_cover[i]);
  const p0 = h.surface_pressure[idx[0]], p12 = h.surface_pressure[idx[Math.min(12, idx.length - 1)]];
  $('s-low').textContent = t.length ? f(Math.min(...t)).toFixed(0) + '°' : '--';
  const ms = Math.min(...spread);
  $('s-spread').textContent = (ms * 1.8).toFixed(0) + '°';
  $('s-spread').style.color = ms < 2 ? 'var(--red)' : ms < 4 ? 'var(--amber)' : 'var(--green)';
  $('s-rain').textContent = rain.length ? Math.max(...rain) + '%' : '--';
  $('s-wind').textContent = gust.length ? (Math.max(...gust) * 2.23694).toFixed(0) + ' mph' : '--';
  $('s-cloud').textContent = night.length ? Math.round(night.reduce((a, b) => a + b, 0) / night.length) + '%' : '--';
  const dp = p12 - p0;
  $('s-dp').textContent = (dp >= 0 ? '+' : '') + dp.toFixed(1);
  $('s-dp').style.color = dp < -3 ? 'var(--amber)' : 'var(--text)';
}

function chart(j, idx) {
  const h = j.hourly, W = 400, H = 130, pad = 6;
  const t = idx.map(i => f(h.temperature_2m[i])), d = idx.map(i => f(h.dew_point_2m[i]));
  const all = t.concat(d).filter(v => v !== null);
  const lo = Math.floor(Math.min(...all)) - 1, hi = Math.ceil(Math.max(...all)) + 1;
  const x = k => pad + k * (W - 2 * pad) / Math.max(1, idx.length - 1);
  const y = v => H - pad - (v - lo) * (H - 2 * pad) / (hi - lo);
  const path = arr => arr.map((v, k) => (k ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  let s = '';
  // rain probability bars
  idx.forEach((i, k) => { const p = h.precipitation_probability[i] || 0;
    if (p > 0) s += `<rect x="${x(k) - 1.5}" y="${H - pad - p * 0.4}" width="3" height="${p * 0.4}" fill="#60A5FA" opacity=".35"/>`; });
  // midnight markers
  idx.forEach((i, k) => { if (new Date((h.time[i] + j.utc_offset_seconds) * 1000).getUTCHours() === 0)
    s += `<line x1="${x(k)}" x2="${x(k)}" y1="0" y2="${H}" stroke="#1F2935" stroke-width="1"/>`; });
  s += `<path d="${path(d)}" fill="none" stroke="#22D3EE" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
  s += `<path d="${path(t)}" fill="none" stroke="#FF8A65" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
  $('chart').innerHTML = s;
  $('range').textContent = `${lo}° to ${hi}°F`;
}

function render(j, fetchedAt, cached) {
  const { text, idx } = buildPayload(j);
  fc = { text, j };
  $('loc').textContent = j.place || `${j.latitude.toFixed(3)}, ${j.longitude.toFixed(3)}`;
  $('elev').textContent = `${Math.round(j.elevation * 3.28084).toLocaleString()} ft`;
  const tm = new Date(fetchedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('fetched').innerHTML = cached ? `<span class="warn">Offline &mdash; using forecast from ${new Date(fetchedAt).toLocaleString()}</span>`
                                  : `Open-Meteo, ${idx.length} h, fetched ${tm}`;
  $('nwr').textContent = j.nwr
    ? `NOAA Weather Radio ${j.nwr.freq} MHz • ${j.nwr.call} ${j.nwr.site}, ${j.nwr.st} (${Math.round(j.nwr.mi)} mi${j.nwr.byCounty ? ', covers ' + j.county + ' Co.' : ''})`
    : '';
  summarize(j, idx);
  chart(j, idx);
  $('sync').disabled = false;
}

// Fetch + show the forecast for a point. `label` is a fallback name if reverse geocoding finds nothing.
async function loadAt(lat, lon, label) {
  $('results').innerHTML = '';
  try {
    state('FETCHING');
    const j = await fetchForecast(lat, lon);
    if (!j.place && label) j.place = label;
    try { localStorage.setItem('cloaca_fc', JSON.stringify({ at: Date.now(), j })); } catch (e) {}
    render(j, Date.now(), false);
    remember(j.place || `${lat.toFixed(3)}, ${lon.toFixed(3)}`, lat, lon);
    state('READY', 'var(--green)');
  } catch (e) {
    showOffline();
    log(e.message, 'err');
  }
}

// Fall back to the last forecast this phone downloaded
function showOffline() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('cloaca_fc')); } catch (_) {}
  if (saved) {
    render(saved.j, saved.at, true);
    state('OFFLINE', 'var(--amber)');
  } else {
    state('ERROR', 'var(--red)');
  }
}

async function loadHere() {
  let c;
  try {
    state('LOCATING');
    c = await locate();
  } catch (e) {
    showOffline();
    log(e.message + ' - search for a place instead', 'err');
    return;
  }
  await loadAt(c.latitude, c.longitude, null);
}

// "47.6062, -122.3321", "47.6062 -122.3321", or a map link with "@47.6,-122.3" / "q=47.6,-122.3"
function parseCoords(text) {
  const m = text.match(/(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if (!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && /[.,]/.test(m[0]) ? { lat, lon } : null;
}

async function search(q) {
  q = q.trim();
  if (!q) return;
  const c = parseCoords(q);
  if (c) return loadAt(c.lat, c.lon, null);
  state('SEARCHING');
  const box = $('results');
  box.innerHTML = '';
  try {
    const g = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&format=json&name=' +
                            encodeURIComponent(q), 'Search');
    const list = g.results || [];
    if (!list.length) { box.innerHTML = '<div class="sub">No matches. Try a nearby town or paste coordinates.</div>'; }
    for (const r of list) {
      const d = document.createElement('div');
      d.className = 'result';
      const where = [r.admin1, r.country_code].filter(Boolean).join(', ');
      const ft = r.elevation != null ? ` \u2022 ${Math.round(r.elevation * 3.28084).toLocaleString()} ft` : '';
      d.innerHTML = '';
      d.append(r.name + ' ');
      const sp = document.createElement('span');
      sp.textContent = where + ft;
      d.append(sp);
      d.onclick = () => loadAt(r.latitude, r.longitude, r.name);
      box.appendChild(d);
    }
    state(fc ? 'READY' : 'SEARCH', fc ? 'var(--green)' : 'var(--dim)');
  } catch (e) {
    log(e.message, 'err');
    state('ERROR', 'var(--red)');
  }
}

// Recent places (this phone only)
function recents() {
  try { return JSON.parse(localStorage.getItem('cloaca_recent')) || []; } catch (e) { return []; }
}
function remember(name, lat, lon) {
  const list = recents().filter(r => Math.abs(r.lat - lat) > 0.01 || Math.abs(r.lon - lon) > 0.01);
  list.unshift({ name, lat, lon });
  try { localStorage.setItem('cloaca_recent', JSON.stringify(list.slice(0, 6))); } catch (e) {}
  showRecents();
}
function showRecents() {
  const box = $('recent');
  box.innerHTML = '';
  for (const r of recents()) {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = r.name;
    c.onclick = () => loadAt(r.lat, r.lon, r.name);
    box.appendChild(c);
  }
}

async function staleReload() {
  try {
    const r = await fetch('version.txt', { cache: 'no-store' });
    const v = r.ok ? (await r.text()).trim() : '';
    if (!/^[\w.-]{1,40}$/.test(v) || v === PAGE_VERSION) return false;
    const u = new URL(location.href);
    if (u.searchParams.get('v') === v) return false;   // already tried; don't loop
    u.searchParams.set('v', v);
    location.replace(u.toString());
    return true;
  } catch (e) {
    return false;   // offline: keep the cached page
  }
}

async function load() {
  $('ver').textContent = 'page ' + PAGE_VERSION;
  if (await staleReload()) return;
  if (!navigator.bluetooth) log('This browser has no Web Bluetooth. Use Chrome on Android.', 'err');
  showRecents();
  // Links/NFC tags can pin a spot: ?lat=..&lon=..  or  ?q=Leavenworth
  const u = new URLSearchParams(location.search);
  const lat = parseFloat(u.get('lat')), lon = parseFloat(u.get('lon'));
  if (!isNaN(lat) && !isNaN(lon)) return loadAt(lat, lon, u.get('name'));
  if (u.get('q')) { $('q').value = u.get('q'); return search(u.get('q')); }
  return loadHere();
}

function waitStatus(chr, timeoutMs) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { chr.removeEventListener('characteristicvaluechanged', on); reject(new Error('No reply from CLOACA')); }, timeoutMs);
    function on(ev) {
      const s = new TextDecoder().decode(ev.target.value);
      if (s.startsWith('OK') || s.startsWith('ERR')) {
        clearTimeout(timer);
        chr.removeEventListener('characteristicvaluechanged', on);
        resolve(s);
      }
    }
    chr.addEventListener('characteristicvaluechanged', on);
  });
}

async function sync() {
  if (!fc) return;
  $('sync').disabled = true;
  $('log').innerHTML = '';
  let dev;
  try {
    state('CONNECTING', 'var(--amber)');
    dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    log('Connecting to ' + (dev.name || 'CLOACA') + '…');
    const gatt = await dev.gatt.connect();
    const svc = await gatt.getPrimaryService(SVC);
    const fcChr = await svc.getCharacteristic(FC_CHR);
    const stChr = await svc.getCharacteristic(ST_CHR);
    await stChr.startNotifications();
    const reply = waitStatus(stChr, 15000);

    const bytes = new TextEncoder().encode(fc.text);
    state('SENDING', 'var(--amber)');
    log(`Sending ${(bytes.length / 1024).toFixed(1)} KB…`);
    for (let o = 0; o < bytes.length; o += CHUNK)
      await fcChr.writeValueWithResponse(bytes.slice(o, o + CHUNK));

    const st = await reply;
    if (!st.startsWith('OK')) throw new Error('CLOACA rejected forecast: ' + st);
    const [, nh, ndays] = st.split(',');
    log(`CLOACA stored ${nh} hours + ${ndays || 0} days and set its clock.`, 'ok');

    try {
      const env = new TextDecoder().decode(await (await svc.getCharacteristic(ENV_CHR)).readValue());
      const kv = Object.fromEntries(env.split(',').map(p => p.split('=')));
      if (kv.co2) {
        $('c-co2').textContent = kv.co2;
        $('c-air').textContent = kv.air || '';
        $('c-clim').textContent = `${Number(kv.t).toFixed(1)}°C • ${Number(kv.rh).toFixed(0)}% • dew ${Number(kv.td).toFixed(1)}°`;
        $('cabin').classList.remove('hidden');
      }
    } catch (e) { /* cabin readout is optional */ }
    state('SYNCED', 'var(--green)');
  } catch (e) {
    log(e.message, 'err');
    state('FAILED', 'var(--red)');
  } finally {
    if (dev && dev.gatt.connected) dev.gatt.disconnect();
    $('sync').disabled = false;
  }
}

$('sync').addEventListener('click', sync);
$('search').addEventListener('submit', e => { e.preventDefault(); $('q').blur(); search($('q').value); });
$('gps').addEventListener('click', () => { $('q').value = ''; loadHere(); });
load();
</script>
